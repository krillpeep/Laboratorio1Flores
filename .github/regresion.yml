name: Suite de regresión
on: [push]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test   # Ejecuta pruebas funcionales / integración
      - run: npx jest               # Ejecuta pruebas unitarias